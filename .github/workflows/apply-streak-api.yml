name: Apply streak API integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, 'feat(progress): integrate streak API') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire streak API into Express
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('server/src/index.js')
          text = path.read_text()

          if "./streaks.js" in text:
              raise SystemExit('streak API already integrated')

          text = text.replace(
              "import { PrismaClient } from '@prisma/client'",
              "import { PrismaClient } from '@prisma/client'\nimport { buildStreakSummary, utcDay } from './streaks.js'",
              1,
          )

          marker = "const validGoalType = (value) => ['MEMORIZE', 'REVIEW', 'RECITE'].includes(value)"
          helper = """const recordActivity = async (userId) => {\n  const date = utcDay()\n  return prisma.activityDay.upsert({\n    where: { userId_date: { userId, date } },\n    create: { userId, date },\n    update: {}\n  })\n}\n\n"""
          if marker not in text:
              raise SystemExit('streak insertion marker not found')
          text = text.replace(marker, helper + marker, 1)

          route_marker = "app.get('/api/goals', requireAuth, async (req, res) => {"
          routes = """app.post('/api/activity', requireAuth, async (req, res) => {\n  try {\n    const activity = await recordActivity(req.user.id)\n    res.status(201).json({ data: { id: activity.id, date: activity.date } })\n  } catch (error) {\n    console.error(error)\n    res.status(503).json({ error: 'Activity tracking is temporarily unavailable' })\n  }\n})\n\napp.get('/api/streaks', requireAuth, async (req, res) => {\n  try {\n    const today = utcDay()\n    const data = await prisma.activityDay.findMany({\n      where: { userId: req.user.id, date: { lte: today } },\n      orderBy: { date: 'desc' },\n      take: 366,\n      select: { date: true }\n    })\n    res.json({ data: buildStreakSummary(data.map(item => item.date), today) })\n  } catch (error) {\n    console.error(error)\n    res.status(503).json({ error: 'Streak data is temporarily unavailable' })\n  }\n})\n\n"""
          if route_marker not in text:
              raise SystemExit('goals route marker not found')
          text = text.replace(route_marker, routes + route_marker, 1)

          progress_pattern = r"(app\.put\('/api/progress'[\s\S]*?\n    res\.json\(\{ data \}\))"
          match = re.search(progress_pattern, text)
          if not match:
              raise SystemExit('progress route response not found')
          block = match.group(1).replace("\n    res.json({ data })", "\n    await recordActivity(req.user.id)\n    res.json({ data })", 1)
          text = text[:match.start(1)] + block + text[match.end(1):]

          goal_pattern = r"(app\.patch\('/api/goals/:type/progress'[\s\S]*?\n    res\.json\(\{ data \}\))"
          match = re.search(goal_pattern, text)
          if not match:
              raise SystemExit('goal progress response not found')
          block = match.group(1).replace("\n    res.json({ data })", "\n    await recordActivity(req.user.id)\n    res.json({ data })", 1)
          text = text[:match.start(1)] + block + text[match.end(1):]

          path.write_text(text)

      - name: Validate changes
        run: |
          node --check server/src/index.js
          node --check server/src/streaks.js
          node --test server/src/streaks.test.js

      - name: Commit integrated API
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/index.js .github/workflows/apply-streak-api.yml
          git rm .github/workflows/apply-streak-api.yml
          git commit -m "feat(progress): integrate streak API"
          git push origin main
