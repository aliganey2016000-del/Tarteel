name: Apply streak API integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire streak API into Express
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('server/src/index.js')
          text = path.read_text()

          if "./streaks.js" in text:
              print('streak API already integrated')
              raise SystemExit(0)

          text = text.replace(
              "import { PrismaClient } from '@prisma/client'",
              "import { PrismaClient } from '@prisma/client'\nimport { buildStreakSummary, utcDay } from './streaks.js'",
              1,
          )

          marker = "const validGoalType = (value) => ['MEMORIZE', 'REVIEW', 'RECITE'].includes(value)"
          helper = """const recordActivity = async (userId) => {
            const date = utcDay()
            return prisma.activityDay.upsert({
              where: { userId_date: { userId, date } },
              create: { userId, date },
              update: {}
            })
          }

          """
          if marker not in text:
              raise SystemExit('streak insertion marker not found')
          text = text.replace(marker, helper + marker, 1)

          route_marker = "app.get('/api/goals', requireAuth, async (req, res) => {"
          routes = """app.post('/api/activity', requireAuth, async (req, res) => {
            try {
              const activity = await recordActivity(req.user.id)
              res.status(201).json({ data: { id: activity.id, date: activity.date } })
            } catch (error) {
              console.error(error)
              res.status(503).json({ error: 'Activity tracking is temporarily unavailable' })
            }
          })

          app.get('/api/streaks', requireAuth, async (req, res) => {
            try {
              const today = utcDay()
              const data = await prisma.activityDay.findMany({
                where: { userId: req.user.id, date: { lte: today } },
                orderBy: { date: 'desc' },
                take: 366,
                select: { date: true }
              })
              res.json({ data: buildStreakSummary(data.map(item => item.date), today) })
            } catch (error) {
              console.error(error)
              res.status(503).json({ error: 'Streak data is temporarily unavailable' })
            }
          })

          """
          if route_marker not in text:
              raise SystemExit('goals route marker not found')
          text = text.replace(route_marker, routes + route_marker, 1)

          progress_pattern = r"(app\.put\('/api/progress'[\s\S]*?\n    res\.json\(\{ data \}\))"
          match = re.search(progress_pattern, text)
          if not match:
              raise SystemExit('progress route response not found')
          block = match.group(1).replace("\n    res.json({ data })", "\n    await recordActivity(req.user.id)\n    res.json({ data })", 1)
          text = text[:match.start(1)] + block + text[match.end(1):]

          goal_pattern = r"(app\.patch\('/api/goals/:type/progress'[\s\S]*?\n    res\.json\(\{ data \}\))"
          match = re.search(goal_pattern, text)
          if not match:
              raise SystemExit('goal progress response not found')
          block = match.group(1).replace("\n    res.json({ data })", "\n    await recordActivity(req.user.id)\n    res.json({ data })", 1)
          text = text[:match.start(1)] + block + text[match.end(1):]

          path.write_text(text)
          PY

      - name: Validate changes
        run: |
          node --check server/src/index.js
          node --check server/src/streaks.js
          node --test server/src/streaks.test.js

      - name: Commit integrated API and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/index.js
          git rm .github/workflows/apply-streak-api.yml
          git commit -m "feat(progress): integrate streak API"
          git push origin main
